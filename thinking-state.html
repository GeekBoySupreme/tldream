<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thinking Bubble</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .message-bubble {
            background: #f3f3f3;
            padding: 10px 16px;
            border-radius: 999px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spring-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .spring-path {
            fill: none;
            stroke: #999;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: drawPath 2.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }

        @keyframes drawPath {
            0% {
                stroke-dashoffset: 200;
                opacity: 0.3;
            }
            50% {
                stroke-dashoffset: 0;
                opacity: 1;
            }
            100% {
                stroke-dashoffset: -200;
                opacity: 0.3;
            }
        }

        .thinking-text {
            font-size: 15px;
            font-weight: 400;
            color: #666;
            display: flex;
            gap: 0;
            background: linear-gradient(90deg, 
                #666 0%, 
                #666 30%, 
                #f3f3f3 50%, 
                #666 70%, 
                #666 100%
            );
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }

        .thinking-text span {
            display: inline-block;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% center;
            }
            100% {
                background-position: -200% center;
            }
        }
    </style>
</head>
<body>
    <div class="message-bubble">
        <svg class="spring-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <path class="spring-path" d="M 5,20 Q 8,12 12,14 T 16,20 T 20,14 T 24,20 T 28,14 T 32,20 Q 35,22 35,20" />
        </svg>
        <div class="thinking-text" id="thinkingText"></div>
    </div>

    <script>
        // Split text into individual characters for shimmer effect
        const text = 'thinking...';
        const thinkingTextElement = document.getElementById('thinkingText');
        
        text.split('').forEach(char => {
            const span = document.createElement('span');
            span.textContent = char;
            thinkingTextElement.appendChild(span);
        });
    </script>
</body>
</html>
